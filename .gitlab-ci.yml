stages:
  - build
  - release

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

# Cache Cargo registry and build artifacts between jobs
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/

appimage:
  stage: build
  image: fedora:41
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - dnf install -y gcc g++ gtk4-devel libadwaita-devel openssl-devel
        pkg-config file desktop-file-utils fuse-libs curl wget pango-devel
        gdk-pixbuf2-devel graphene-devel cmake
    - export RUSTUP_HOME="${CARGO_HOME}/rustup"
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
    - source "${CARGO_HOME}/env"
    # Download linuxdeploy and GTK plugin
    - curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
    - curl -L -o linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
    - chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh
  script:
    - cargo build --release
    # Prepare AppDir structure
    - mkdir -p AppDir/usr/bin
    - mkdir -p AppDir/usr/share/applications
    - mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
    - cp target/release/gitpulsar-gtk AppDir/usr/bin/
    - cp data/dev.gitpulsar.Gitpulsar.desktop AppDir/usr/share/applications/
    - cp data/icons/hicolor/scalable/apps/dev.gitpulsar.Gitpulsar.svg AppDir/usr/share/icons/hicolor/scalable/apps/
    # Build AppImage (NO_STRIP: linuxdeploy's bundled strip is too old for Fedora's .relr.dyn)
    - export DEPLOY_GTK_VERSION=4
    - export NO_STRIP=true
    - ./linuxdeploy --appdir AppDir
        --plugin gtk
        --desktop-file AppDir/usr/share/applications/dev.gitpulsar.Gitpulsar.desktop
        --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/dev.gitpulsar.Gitpulsar.svg
        --output appimage
    - mv Gitpulsar-*.AppImage "Gitpulsar-${CI_COMMIT_TAG}-x86_64.AppImage"
  artifacts:
    paths:
      - "Gitpulsar-*.AppImage"
    expire_in: never

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - job: appimage
      artifacts: true
  script:
    - |
      # Extract release notes for this version from CHANGELOG.md
      VERSION="${CI_COMMIT_TAG#v}"
      # Extract section between "## vX.Y.Z" and next "## v" header
      # Using sed instead of head -n -1 (not supported in BusyBox/Alpine)
      awk "/^## v${VERSION}/,/^## v/" CHANGELOG.md | sed '1d;$d' > release_notes.md
      if [ ! -s release_notes.md ]; then
        echo "Release ${CI_COMMIT_TAG}" > release_notes.md
      fi
      cat release_notes.md
      # Create release via CLI (description from file)
      release-cli create \
        --name "Gitpulsar ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "$(cat release_notes.md)" \
        --assets-link "{\"name\":\"Gitpulsar-${CI_COMMIT_TAG}-x86_64.AppImage\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/Gitpulsar-${CI_COMMIT_TAG}-x86_64.AppImage?job=appimage\",\"link_type\":\"package\"}"
