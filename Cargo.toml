[workspace]
members = ["crates/gitpulsar-core", "crates/gitpulsar-gtk"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Ilshat"]

[workspace.dependencies]
gitpulsar-core = { path = "crates/gitpulsar-core" }
git2 = "0.19"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
