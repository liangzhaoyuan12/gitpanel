<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>

  <!-- Main branch (vertical line, within safe zone) -->
  <line x1="56" y1="32" x2="56" y2="96" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Branch out and merge back -->
  <path d="M56,48 C64,48 76,54 80,64" stroke="#8ff0a4" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M80,64 C76,74 64,80 56,80" stroke="#8ff0a4" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Commit dots (3 only) -->
  <circle cx="56" cy="48" r="6" fill="#ffffff"/>
  <circle cx="56" cy="80" r="6" fill="#ffffff"/>
  <circle cx="80" cy="64" r="5.5" fill="#8ff0a4"/>
</svg>
