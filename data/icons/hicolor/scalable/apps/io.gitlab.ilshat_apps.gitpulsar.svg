<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>

  <!-- GNOME HIG squircle background with proper margin (8px from edges) -->
  <path d="M 8,44 C 8,22.4 22.4,8 44,8 H 84 C 105.6,8 120,22.4 120,44 V 84 C 120,105.6 105.6,120 84,120 H 44 C 22.4,120 8,105.6 8,84 Z" fill="url(#bg)"/>

  <!-- Main branch (vertical line) -->
  <line x1="46" y1="32" x2="46" y2="98" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Feature branch out and merge back -->
  <path d="M46,46 C56,46 74,54 82,64" stroke="#8ff0a4" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M82,64 C74,74 56,82 46,82" stroke="#8ff0a4" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Commit nodes -->
  <circle cx="46" cy="46" r="7.5" fill="#ffffff"/>
  <circle cx="46" cy="82" r="7.5" fill="#ffffff"/>
  <circle cx="82" cy="64" r="6.5" fill="#8ff0a4"/>

  <!-- Pulsar rays -->
  <line x1="92" y1="64" x2="99" y2="64" stroke="#8ff0a4" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="55" x2="95" y2="50" stroke="#8ff0a4" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="73" x2="95" y2="78" stroke="#8ff0a4" stroke-width="3" stroke-linecap="round"/>
</svg>
