<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (GNOME style) -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>

  <!-- Main branch (vertical line) -->
  <line x1="64" y1="28" x2="64" y2="100" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Left branch -->
  <path d="M64,50 C56,55 44,60 38,72" stroke="#99c1f1" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Right branch (merge) -->
  <path d="M64,42 C72,47 84,52 88,62" stroke="#8ff0a4" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M88,62 C84,72 72,80 64,82" stroke="#8ff0a4" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Commit dots -->
  <circle cx="64" cy="38" r="5" fill="#ffffff"/>
  <circle cx="64" cy="60" r="5" fill="#ffffff"/>
  <circle cx="64" cy="82" r="5" fill="#ffffff"/>
  <circle cx="38" cy="72" r="4.5" fill="#99c1f1"/>
  <circle cx="88" cy="62" r="4.5" fill="#8ff0a4"/>
</svg>
