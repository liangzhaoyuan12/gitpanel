<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (GNOME style) -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#glow)" opacity="0.5"/>

  <!-- Subtle border -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28"
        fill="none" stroke="#1a5fb4" stroke-width="1" opacity="0.3"/>

  <!-- Pulsar star (center bright dot with rays) -->
  <circle cx="64" cy="52" r="8" fill="#ffffff" opacity="0.95"/>
  <circle cx="64" cy="52" r="12" fill="#ffffff" opacity="0.2"/>
  <circle cx="64" cy="52" r="18" fill="#ffffff" opacity="0.08"/>

  <!-- Pulsar horizontal beam -->
  <ellipse cx="64" cy="52" rx="30" ry="3" fill="#ffffff" opacity="0.4"/>

  <!-- Git branch lines emanating from pulsar -->
  <!-- Main branch (straight down) -->
  <line x1="64" y1="60" x2="64" y2="105" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- Left branch -->
  <path d="M64,70 C64,70 50,75 40,90" stroke="#99c1f1" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Right branch -->
  <path d="M64,65 C64,65 78,70 88,82" stroke="#8ff0a4" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Branch merge back -->
  <path d="M88,82 C88,88 75,95 64,95" stroke="#8ff0a4" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Commit dots on branches -->
  <circle cx="64" cy="75" r="3.5" fill="#ffffff"/>
  <circle cx="64" cy="90" r="3.5" fill="#ffffff"/>
  <circle cx="64" cy="105" r="3.5" fill="#ffffff"/>
  <circle cx="52" cy="80" r="3" fill="#99c1f1"/>
  <circle cx="40" cy="90" r="3" fill="#99c1f1"/>
  <circle cx="76" cy="72" r="3" fill="#8ff0a4"/>
  <circle cx="88" cy="82" r="3" fill="#8ff0a4"/>
</svg>
